<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1000" viewBox="0 0 1120 500" role="img"><title>Three moments. One familiar choice.</title><rect x="1" y="1" width="1118" height="498" rx="24" fill="#f2f5ef" stroke="#d7e0d1"/><text x="32" y="48" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="650" fill="#223329" text-anchor="start">Three moments. One familiar choice.</text><text x="32" y="78" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5e7364" text-anchor="start">An IR camera, local face matching, and a password when you need it.</text><rect x="938" y="26" width="150" height="30" rx="15" fill="#e9f0e1" stroke="#e9f0e1"/><text x="1013" y="46" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="600" fill="#3f654d" text-anchor="middle">FLOW OVERVIEW</text><rect x="32" y="108" width="558" height="314" rx="16" fill="#ffffff" stroke="#d7e0d1"/><text x="56" y="141" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#5e7364" text-anchor="start">01  LOCK SCREEN</text><circle cx="311" cy="134" r="3" fill="#3f654d"/><g transform="translate(279,176) scale(1.28)" stroke="#3f654d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V6q0-3 3-3h9m20 0h9q3 0 3 3v9M3 35v9q0 3 3 3h9m20 0h9q3 0 3-3v-9"/><path d="M17 17v5m16-5v5m-16 9q8 9 16 0"/></g><text x="311" y="283" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#223329" text-anchor="middle">Wake. Wait 1.5s. Recognize once.</text><text x="311" y="312" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#5e7364" text-anchor="middle">Manual lock stays locked. No polling loop.</text><rect x="141" y="344" width="164" height="40" rx="10" fill="#e9f0e1" stroke="#e9f0e1"/><g transform="translate(157,353) scale(0.43)" stroke="#3f654d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V6q0-3 3-3h9m20 0h9q3 0 3 3v9M3 35v9q0 3 3 3h9m20 0h9q3 0 3-3v-9"/><path d="M17 17v5m16-5v5m-16 9q8 9 16 0"/></g><text x="190" y="370" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#3f654d" text-anchor="start">Use face</text><rect x="317" y="344" width="164" height="40" rx="10" fill="#ffffff" stroke="#d7e0d1"/><circle cx="336" cy="359" r="1.4" fill="#5e7364"/><circle cx="336" cy="364" r="1.4" fill="#5e7364"/><circle cx="336" cy="369" r="1.4" fill="#5e7364"/><circle cx="341" cy="359" r="1.4" fill="#5e7364"/><circle cx="341" cy="364" r="1.4" fill="#5e7364"/><circle cx="341" cy="369" r="1.4" fill="#5e7364"/><circle cx="346" cy="359" r="1.4" fill="#5e7364"/><circle cx="346" cy="364" r="1.4" fill="#5e7364"/><circle cx="346" cy="369" r="1.4" fill="#5e7364"/><text x="365" y="370" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#223329" text-anchor="start">Use password</text><rect x="610" y="108" width="478" height="148" rx="16" fill="#ffffff" stroke="#d7e0d1"/><text x="634" y="140" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#5e7364" text-anchor="start">02  TERMINAL · SUDO</text><text x="634" y="177" font-family="ui-monospace, monospace" font-size="18" font-weight="500" fill="#223329" text-anchor="start">$ sudo -k -v</text><text x="634" y="207" font-family="ui-monospace, monospace" font-size="16" font-weight="500" fill="#3f654d" text-anchor="start">Use face authentication? [y/N] y</text><text x="634" y="235" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5e7364" text-anchor="start">Look toward your laptop camera.</text><rect x="610" y="274" width="478" height="148" rx="16" fill="#ffffff" stroke="#d7e0d1"/><text x="634" y="306" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#5e7364" text-anchor="start">03  APPS · POLKIT</text><text x="634" y="339" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="550" fill="#223329" text-anchor="start">Choose how to authorize this action</text><rect x="634" y="358" width="164" height="40" rx="10" fill="#e9f0e1" stroke="#e9f0e1"/><g transform="translate(650,367) scale(0.43)" stroke="#3f654d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V6q0-3 3-3h9m20 0h9q3 0 3 3v9M3 35v9q0 3 3 3h9m20 0h9q3 0 3-3v-9"/><path d="M17 17v5m16-5v5m-16 9q8 9 16 0"/></g><text x="683" y="384" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#3f654d" text-anchor="start">Use face</text><rect x="810" y="358" width="164" height="40" rx="10" fill="#ffffff" stroke="#d7e0d1"/><circle cx="829" cy="373" r="1.4" fill="#5e7364"/><circle cx="829" cy="378" r="1.4" fill="#5e7364"/><circle cx="829" cy="383" r="1.4" fill="#5e7364"/><circle cx="834" cy="373" r="1.4" fill="#5e7364"/><circle cx="834" cy="378" r="1.4" fill="#5e7364"/><circle cx="834" cy="383" r="1.4" fill="#5e7364"/><circle cx="839" cy="373" r="1.4" fill="#5e7364"/><circle cx="839" cy="378" r="1.4" fill="#5e7364"/><circle cx="839" cy="383" r="1.4" fill="#5e7364"/><text x="858" y="384" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#223329" text-anchor="start">Use password</text><text x="560" y="467" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5e7364" text-anchor="middle">Password fallback  /  Local face model  /  Consent before sudo and app scans</text></svg>