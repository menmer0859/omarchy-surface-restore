<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1000" viewBox="0 0 1120 500" role="img"><title>三个场景，一套熟悉的选择。</title><rect x="1" y="1" width="1118" height="498" rx="24" fill="#151e19" stroke="#374a3c"/><text x="32" y="48" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="650" fill="#e9eee5" text-anchor="start">三个场景，一套熟悉的选择。</text><text x="32" y="78" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#a9baac" text-anchor="start">红外相机，本机识别；需要时，仍可使用密码。</text><rect x="938" y="26" width="150" height="30" rx="15" fill="#2d4030" stroke="#2d4030"/><text x="1013" y="46" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="600" fill="#bfd7a6" text-anchor="middle">流程示意</text><rect x="32" y="108" width="558" height="314" rx="16" fill="#1d2a21" stroke="#374a3c"/><text x="56" y="141" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#a9baac" text-anchor="start">01  锁屏与解锁</text><circle cx="311" cy="134" r="3" fill="#bfd7a6"/><g transform="translate(279,176) scale(1.28)" stroke="#bfd7a6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V6q0-3 3-3h9m20 0h9q3 0 3 3v9M3 35v9q0 3 3 3h9m20 0h9q3 0 3-3v-9"/><path d="M17 17v5m16-5v5m-16 9q8 9 16 0"/></g><text x="311" y="283" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#e9eee5" text-anchor="middle">唤醒后，尝试一次识别</text><text x="311" y="312" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#a9baac" text-anchor="middle">手动锁屏保持锁定，不在后台反复扫描。</text><rect x="141" y="344" width="164" height="40" rx="10" fill="#2d4030" stroke="#2d4030"/><g transform="translate(157,353) scale(0.43)" stroke="#bfd7a6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V6q0-3 3-3h9m20 0h9q3 0 3 3v9M3 35v9q0 3 3 3h9m20 0h9q3 0 3-3v-9"/><path d="M17 17v5m16-5v5m-16 9q8 9 16 0"/></g><text x="190" y="370" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#bfd7a6" text-anchor="start">使用人脸</text><rect x="317" y="344" width="164" height="40" rx="10" fill="#1d2a21" stroke="#374a3c"/><circle cx="336" cy="359" r="1.4" fill="#a9baac"/><circle cx="336" cy="364" r="1.4" fill="#a9baac"/><circle cx="336" cy="369" r="1.4" fill="#a9baac"/><circle cx="341" cy="359" r="1.4" fill="#a9baac"/><circle cx="341" cy="364" r="1.4" fill="#a9baac"/><circle cx="341" cy="369" r="1.4" fill="#a9baac"/><circle cx="346" cy="359" r="1.4" fill="#a9baac"/><circle cx="346" cy="364" r="1.4" fill="#a9baac"/><circle cx="346" cy="369" r="1.4" fill="#a9baac"/><text x="365" y="370" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#e9eee5" text-anchor="start">使用密码</text><rect x="610" y="108" width="478" height="148" rx="16" fill="#1d2a21" stroke="#374a3c"/><text x="634" y="140" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#a9baac" text-anchor="start">02  终端 · SUDO</text><text x="634" y="177" font-family="ui-monospace, monospace" font-size="18" font-weight="500" fill="#e9eee5" text-anchor="start">$ sudo -k -v</text><text x="634" y="207" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#bfd7a6" text-anchor="start">使用人脸识别？[y/N] y</text><text x="634" y="235" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#a9baac" text-anchor="start">请看向笔记本屏幕顶部的摄像头。</text><rect x="610" y="274" width="478" height="148" rx="16" fill="#1d2a21" stroke="#374a3c"/><text x="634" y="306" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#a9baac" text-anchor="start">03  应用 · POLKIT</text><text x="634" y="339" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="550" fill="#e9eee5" text-anchor="start">选择本次管理员授权的方式</text><rect x="634" y="358" width="164" height="40" rx="10" fill="#2d4030" stroke="#2d4030"/><g transform="translate(650,367) scale(0.43)" stroke="#bfd7a6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V6q0-3 3-3h9m20 0h9q3 0 3 3v9M3 35v9q0 3 3 3h9m20 0h9q3 0 3-3v-9"/><path d="M17 17v5m16-5v5m-16 9q8 9 16 0"/></g><text x="683" y="384" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" fill="#bfd7a6" text-anchor="start">使用人脸</text><rect x="810" y="358" width="164" height="40" rx="10" fill="#1d2a21" stroke="#374a3c"/><circle cx="829" cy="373" r="1.4" fill="#a9baac"/><circle cx="829" cy="378" r="1.4" fill="#a9baac"/><circle cx="829" cy="383" r="1.4" fill="#a9baac"/><circle cx="834" cy="373" r="1.4" fill="#a9baac"/><circle cx="834" cy="378" r="1.4" fill="#a9baac"/><circle cx="834" cy="383" r="1.4" fill="#a9baac"/><circle cx="839" cy="373" r="1.4" fill="#a9baac"/><circle cx="839" cy="378" r="1.4" fill="#a9baac"/><circle cx="839" cy="383" r="1.4" fill="#a9baac"/><text x="858" y="384" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="500" fill="#e9eee5" text-anchor="start">使用密码</text><text x="560" y="467" font-family="Inter, system-ui, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#a9baac" text-anchor="middle">密码兜底  /  本机模型  /  sudo 与应用先确认，再扫脸</text></svg>